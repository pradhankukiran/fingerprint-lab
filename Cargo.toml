[package]
name = "fingerprint-lab"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Compare browser transport fingerprints and run a session-aware Rust reverse proxy"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
http-body = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "cookies", "stream", "json", "gzip", "brotli", "deflate", "zstd"] }
cookie_store = { version = "0.22", features = ["serde", "serde_json"] }
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wreq = { version = "=0.16.1", features = ["cookies", "stream", "ws", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=0.2.0", features = ["emulation-serde", "emulation-compression"] }

[dev-dependencies]
flate2 = "1"
tokio-tungstenite = "0.28"

[[bin]]
name = "fingerprint-lab"
path = "src/main.rs"
